name: CI Build and Test for PR

permissions:
  contents: read

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: check format
        run: make check_format

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: build and test
        run: make docker_tests

  precommits:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.1"

      - name: run pre-commits
        run: |
          make precommit_install
          pre-commit run -a

      # If previous stage fails, print resolution steps
      - if: ${{ failure() }}
        name: Read for resolution steps
        run: |
          echo "Pre-commits failed! Run 'make precommit_install' then 'pre-commits run -a' to fix."
          exit 1
